name: CI

# Typecheck + build on every push and PR. Railway auto-deploys on push to main,
# so enable "Wait for CI" in the Railway service settings to make a red check
# here block the deploy (otherwise this is advisory only).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
