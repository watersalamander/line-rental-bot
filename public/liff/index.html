<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>เพิ่มสัญญาเช่า</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --bg:#f7f8fa; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --brand:#06c755; --danger:#d92d20; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 8px 0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
    label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; }
    .req::after { content:" *"; color:var(--danger); }
    input, select { width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
    .row { display:flex; gap:10px; }
    .row > div { flex:1; }
    .hint { font-size:12px; color:var(--muted); margin-top:4px; }
    .toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .toggle button { flex:1; padding:11px; font-size:14px; border:0; background:#fff; color:var(--ink); }
    .toggle button.on { background:var(--brand); color:#fff; font-weight:600; }
    button.primary { width:100%; padding:14px; font-size:16px; font-weight:700; color:#fff; background:var(--brand); border:0; border-radius:12px; margin-top:8px; }
    button.primary:disabled { opacity:.5; }
    .msg { padding:12px; border-radius:10px; font-size:14px; margin-bottom:12px; display:none; }
    .msg.err { background:#fef3f2; color:var(--danger); border:1px solid #fecdca; display:block; }
    .msg.ok  { background:#ecfdf3; color:#027a48; border:1px solid #a6f4c5; display:block; }
    .hidden { display:none; }
    .status { text-align:center; color:var(--muted); padding:40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="boot" class="status">กำลังโหลด…</div>

    <div id="app" class="hidden">
      <h1>➕ เพิ่มสัญญาเช่า</h1>
      <div id="msg" class="msg"></div>

      <form id="form">
        <div class="card">
          <label class="req">ทรัพย์สิน / ห้อง</label>
          <select id="propertySelect">
            <option value="__new__">➕ เพิ่มห้องใหม่…</option>
          </select>
          <div id="newProperty">
            <div class="row">
              <div>
                <label class="req">อาคาร</label>
                <input id="building" placeholder="เช่น ไอดีโอ สุขุมวิท" />
              </div>
              <div>
                <label class="req">เลขห้อง</label>
                <input id="unitNo" placeholder="เช่น 2508" />
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <label class="req">ชื่อผู้เช่า</label>
          <input id="tenantName" placeholder="ชื่อสำหรับแสดง/ติดตาม" />

          <label class="req">ค่าเช่าต่อเดือน (บาท)</label>
          <input id="rentAmount" type="number" inputmode="decimal" min="1" step="0.01" placeholder="15000" />

          <label class="req">รูปแบบการเรียกเก็บ</label>
          <div class="toggle" id="billingToggle">
            <button type="button" data-val="fixed" class="on">ค่าเช่าคงที่</button>
            <button type="button" data-val="rent_plus_utilities">ค่าเช่า + ค่าน้ำ/ไฟ</button>
          </div>
          <div class="hint">“ค่าเช่า + ค่าน้ำ/ไฟ” ช่วยไม่ให้ยอดชำระเกินถูกแจ้งเป็นข้อผิดพลาด</div>

          <label>เงินมัดจำ (บาท)</label>
          <input id="depositAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="ไม่บังคับ" />
        </div>

        <div class="card">
          <label class="req">วันครบกำหนดชำระของเดือน</label>
          <input id="dueDay" type="number" min="1" max="28" step="1" placeholder="1–28" />

          <div class="row">
            <div>
              <label class="req">วันเริ่มสัญญา</label>
              <input id="startDate" type="date" />
            </div>
            <div>
              <label class="req">วันสิ้นสุดสัญญา</label>
              <input id="endDate" type="date" />
            </div>
          </div>

          <label>กำหนดยอดบิลแรกเอง (บาท)</label>
          <input id="firstInvoiceOverride" type="number" inputmode="decimal" min="1" step="0.01" placeholder="เว้นว่าง = เต็มจำนวนค่าเช่า (สำหรับเข้าอยู่กลางเดือน)" />

          <label>ชื่อผู้ชำระที่คาดไว้</label>
          <input id="expectedPayerName" placeholder="ชื่อบัญชีธนาคารของผู้เช่า (ไม่บังคับ)" />
          <div class="hint">ช่วยตรวจจับสลิปที่ผิดหรือยืมมาในภายหลัง</div>
        </div>

        <button type="submit" class="primary" id="submitBtn">สร้างสัญญาเช่า</button>
      </form>
    </div>
  </div>

  <script>
    let idToken = null;
    let billingType = 'fixed';

    const $ = (id) => document.getElementById(id);
    // Condo label: condo name alone, "The Esse Asoke" (mirrors src/services/labels.ts).
    function propLabel(p) {
      const name = (p.name || '').trim();
      const unit = (p.unit_no || '').trim();
      // Legacy rows fold the unit into `name` ("XYZ 12/34") — strip it off.
      if (name && unit && name.endsWith(unit)) return name.slice(0, -unit.length).trim() || name;
      return name || (p.building || '').trim() || 'ห้อง';
    }
    function showMsg(kind, text) {
      const el = $('msg');
      el.className = 'msg ' + kind;
      el.textContent = text;
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function boot() {
      try {
        const cfg = await fetch('/api/config').then((r) => r.json());
        if (!cfg.liffId) throw new Error('เซิร์ฟเวอร์ไม่พบ LIFF_ID');
        await liff.init({ liffId: cfg.liffId });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        idToken = liff.getIDToken();
        if (!idToken) throw new Error('ไม่พบ ID token — ตรวจสอบว่า LIFF scope มี “openid” หรือไม่');
        await loadProperties();
        $('boot').classList.add('hidden');
        $('app').classList.remove('hidden');
      } catch (e) {
        $('boot').textContent = 'ตั้งค่าผิดพลาด: ' + (e && e.message ? e.message : e);
      }
    }

    async function loadProperties() {
      const res = await fetch('/api/properties', { headers: { Authorization: 'Bearer ' + idToken } });
      if (!res.ok) throw new Error('โหลดรายการห้องไม่สำเร็จ (' + res.status + ')');
      const { properties } = await res.json();
      const sel = $('propertySelect');
      for (const p of properties) {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = propLabel(p);
        sel.insertBefore(opt, sel.firstChild);
      }
      sel.value = properties.length ? properties[0].id : '__new__';
      toggleNewProperty();
    }

    function toggleNewProperty() {
      const isNew = $('propertySelect').value === '__new__';
      $('newProperty').style.display = isNew ? 'block' : 'none';
    }

    $('propertySelect').addEventListener('change', toggleNewProperty);

    $('billingToggle').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-val]');
      if (!btn) return;
      billingType = btn.dataset.val;
      for (const b of $('billingToggle').children) b.classList.toggle('on', b === btn);
    });

    function numOrNull(id) {
      const v = $(id).value.trim();
      return v === '' ? null : Number(v);
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const isNew = $('propertySelect').value === '__new__';
      const body = {
        tenantName: $('tenantName').value.trim(),
        rentAmount: Number($('rentAmount').value),
        billingType,
        depositAmount: numOrNull('depositAmount'),
        dueDay: Number($('dueDay').value),
        startDate: $('startDate').value,
        endDate: $('endDate').value,
        firstInvoiceOverride: numOrNull('firstInvoiceOverride'),
        expectedPayerName: $('expectedPayerName').value.trim() || null,
      };
      if (isNew) {
        body.building = $('building').value.trim();
        body.unitNo = $('unitNo').value.trim();
      } else {
        body.propertyId = $('propertySelect').value;
      }

      $('submitBtn').disabled = true;
      try {
        const res = await fetch('/api/leases', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + idToken },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ('ข้อผิดพลาด ' + res.status));

        const unit = propLabel(data.property);
        const rent = Number(data.lease.rent_amount).toLocaleString();
        showMsg('ok', `สร้างสัญญาเช่าแล้ว — ${unit}, ฿${rent}/เดือน, ครบกำหนดวันที่ ${data.lease.due_day} ของเดือน สร้างบิลแรกสำหรับงวด ${data.invoice.period_month} แล้ว ตอนนี้พิมพ์ /setup ในกลุ่มของผู้เช่าเพื่อเชื่อมกลุ่มครับ`);
        $('form').reset();
        billingType = 'fixed';
      } catch (err) {
        showMsg('err', err.message || 'เกิดข้อผิดพลาดบางอย่าง');
      } finally {
        $('submitBtn').disabled = false;
      }
    });

    boot();
  </script>
</body>
</html>
