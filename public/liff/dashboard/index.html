<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>แดชบอร์ด</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg:#f7f8fa; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
      --brand:#06c755; --danger:#d92d20; --warn:#b54708; --info:#175cd3;
      --pos:#039855; --neg:#d92d20; /* chart polarity pair (CVD-validated) */
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 8px 0 12px; }
    h2 { font-size: 13px; color:var(--muted); font-weight:600; letter-spacing:.02em; margin: 0 0 8px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
    .status { text-align:center; color:var(--muted); padding:40px 0; }
    .hidden { display:none; }
    .empty { color:var(--muted); font-size:13px; }
    .pos { color:var(--pos); }
    .neg { color:var(--neg); }
    .warn { color:var(--warn); }
    .muted { color:var(--muted); }

    /* ── main page ── */
    .hero { background:linear-gradient(135deg,#047a52,#06a35f); border:0; color:#fff; padding:18px 16px; }
    .hero .k { font-size:12px; font-weight:600; opacity:.85; }
    .hero .v { font-size:30px; font-weight:800; margin-top:4px; letter-spacing:-.01em; }
    .hero .s { font-size:12px; opacity:.8; margin-top:4px; }

    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    a.pcard { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px;
              padding:12px; text-decoration:none; color:inherit; -webkit-tap-highlight-color:transparent; }
    a.pcard:active { background:#f2f4f7; }
    .pcard .chip { display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; }
    .chip.rented { background:#ecfdf3; color:#027a48; }
    .chip.vacant { background:#f2f4f7; color:var(--muted); }
    .pcard .pname { font-weight:700; font-size:14px; line-height:1.3; margin:8px 0 2px;
                    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .pcard .rent { font-size:17px; font-weight:800; margin:2px 0 6px; }
    .pcard .rent span { font-size:11px; font-weight:600; color:var(--muted); }
    .pcard .meta { font-size:11px; color:var(--muted); margin-top:2px; }
    .pcard .meta.warn { color:var(--warn); font-weight:600; }
    .pcard .meta.neg { color:var(--neg); font-weight:600; }

    /* ── condo page ── */
    .topbar { display:flex; align-items:center; gap:10px; margin:4px 0 12px; }
    .topbar button { border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 13px;
                     font-size:18px; line-height:1; color:var(--ink); }
    .topbar .pname { font-size:17px; font-weight:800; line-height:1.25; }
    .topbar .owner { font-size:12px; color:var(--muted); margin-top:1px; }

    .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
    .tile .k { font-size:11px; color:var(--muted); font-weight:600; }
    .tile .v { font-size:18px; font-weight:800; margin-top:4px; line-height:1.25; }
    .tile .s { font-size:11px; color:var(--muted); margin-top:4px; }

    .info-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px 8px; }
    .info-grid .k { font-size:11px; color:var(--muted); font-weight:600; }
    .info-grid .v { font-size:14px; font-weight:700; margin-top:2px; line-height:1.3; }

    .chart-caption { font-size:12px; color:var(--muted); margin-top:8px; text-align:center; }
    .chart-caption b { color:var(--ink); }
    svg .hit { cursor:pointer; }

    .row-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .row-head h2 { margin:0; }
    select { border:1px solid var(--line); background:#fff; border-radius:9px; padding:6px 8px;
             font-size:13px; color:var(--ink); font-family:inherit; }

    .txn { display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); }
    .txn:last-child { border-bottom:0; }
    .txn .meta { color:var(--muted); font-size:11px; margin-top:1px; }
    .txn .amt { font-weight:700; white-space:nowrap; }
    .txn .amt.in { color:var(--pos); }
    .txn .amt.out { color:var(--neg); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="boot" class="status">กำลังโหลด…</div>

    <div id="app" class="hidden">
      <!-- ── main page ── -->
      <div id="homeView" class="hidden">
        <h1>🏠 คอนโดครอบครัว</h1>
        <div class="hero card">
          <div class="k">เงินกองกลางสุทธิ (ทั้งหมด)</div>
          <div class="v" id="poolBalance">—</div>
          <div class="s">รายรับหักรายจ่ายสะสมของทุกห้อง</div>
        </div>
        <div id="homeStatus" class="status hidden">กำลังโหลด…</div>
        <div class="grid" id="homeCards"></div>
      </div>

      <!-- ── condo page ── -->
      <div id="propView" class="hidden">
        <div class="topbar">
          <button id="backBtn" type="button" aria-label="กลับ">‹</button>
          <div>
            <div class="pname" id="propName">…</div>
            <div class="owner" id="propOwner"></div>
          </div>
        </div>
        <div id="propStatus" class="status hidden">กำลังโหลด…</div>
        <div id="propBody" class="hidden">
          <div class="tiles">
            <div class="tile">
              <div class="k">รับสุทธิทั้งหมด</div>
              <div class="v" id="allTimeNet">—</div>
              <div class="s" id="allTimeSub"></div>
            </div>
            <div class="tile">
              <div class="k">ค่าเช่าเดือนนี้</div>
              <div class="v" id="rentState">—</div>
              <div class="s" id="rentSub"></div>
            </div>
          </div>

          <div class="card hidden" id="infoCard">
            <h2>ข้อมูลห้อง</h2>
            <div class="info-grid" id="infoGrid"></div>
          </div>

          <div class="card">
            <h2>รายรับสุทธิรายเดือน (12 เดือนล่าสุด)</h2>
            <div id="chartBox"></div>
            <div class="chart-caption" id="chartCaption"></div>
          </div>

          <div class="card">
            <div class="row-head">
              <h2>รายการล่าสุด</h2>
              <select id="monthSel"></select>
            </div>
            <div id="txnList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let idToken = null;
    let routeToken = 0; // guards against out-of-order renders on fast navigation
    const cache = { home: null, props: new Map() };
    let propData = null;    // detail payload behind the currently shown condo page
    let selectedBar = -1;

    const $ = (id) => document.getElementById(id);
    const baht = (n) => {
      const v = Number(n);
      return '฿' + v.toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 });
    };
    const bahtSigned = (n) => (n < 0 ? '−' : n > 0 ? '+' : '') + baht(Math.abs(n));
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    const CATEGORY_TH = {
      rent:'ค่าเช่า', common_fee:'ค่าส่วนกลาง', agency:'ค่านายหน้า', maintenance:'ซ่อมบำรุง',
      tax:'ภาษี/ค่าโอน', utilities:'ค่าน้ำ/ไฟ/เน็ต', insurance:'ประกัน', deposit:'เงินมัดจำ', other:'อื่นๆ',
    };
    const catTh = (c) => CATEGORY_TH[c] || c;

    const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    // 'YYYY-MM' → 'ก.ค. 2569' (Buddhist era)
    const thMonthYear = (p) => TH_MONTHS[Number(p.slice(5, 7)) - 1] + ' ' + (Number(p.slice(0, 4)) + 543);
    // 'YYYY-MM-DD' → '5 ก.ค. 2569'
    const thDate = (d) => Number(d.slice(8, 10)) + ' ' + thMonthYear(d.slice(0, 7));

    async function api(path) {
      const res = await fetch(path, { headers: { Authorization: 'Bearer ' + idToken } });
      if (!res.ok) {
        const body = await res.json().catch(() => null);
        const err = new Error((body && body.error) || 'โหลดข้อมูลไม่สำเร็จ (' + res.status + ')');
        err.denied = res.status === 401 || res.status === 403; // not a linked family member
        throw err;
      }
      // First successful call proves access — only now reveal the page chrome,
      // so an unlinked visitor never sees the header or the pool card.
      $('boot').classList.add('hidden');
      $('app').classList.remove('hidden');
      return res.json();
    }

    // ── main page ─────────────────────────────────────────────
    function renderHome(d) {
      $('poolBalance').textContent = bahtSigned(d.poolBalance);

      $('homeCards').innerHTML = d.properties.map((p) => {
        const rented = p.tenant !== null;
        let endMeta = '<div class="meta">ไม่มีสัญญาเช่า</div>';
        if (rented && p.leaseEnd) {
          const daysLeft = Math.round((Date.parse(p.leaseEnd) - Date.now()) / 86400000);
          const cls = daysLeft < 0 ? 'neg' : daysLeft <= 60 ? 'warn' : '';
          const label = daysLeft < 0 ? 'หมดสัญญาแล้ว (' + thDate(p.leaseEnd) + ')' : 'สิ้นสุด ' + thDate(p.leaseEnd);
          endMeta = '<div class="meta ' + cls + '">📅 ' + label + '</div>';
        }
        return '<a class="pcard" href="#/p/' + p.propertyId + '">' +
          '<span class="chip ' + (rented ? 'rented' : 'vacant') + '">' + (rented ? 'ปล่อยเช่าอยู่' : 'ว่าง') + '</span>' +
          '<div class="pname">' + esc(p.name) + '</div>' +
          (rented
            ? '<div class="rent">' + baht(p.rent) + '<span>/เดือน</span></div>'
            : '<div class="rent muted">—</div>') +
          endMeta +
          '<div class="meta">👤 เจ้าของ: ' + esc(p.owner) + '</div>' +
        '</a>';
      }).join('') || '<div class="card empty" style="grid-column:1/-1">ยังไม่มีคอนโดในระบบ</div>';
    }

    async function showHome() {
      const token = ++routeToken;
      $('homeView').classList.remove('hidden');
      $('propView').classList.add('hidden');
      if (cache.home) renderHome(cache.home); // show last data instantly…
      else $('homeStatus').classList.remove('hidden');
      const d = await api('/api/home');       // …then refresh in the background
      cache.home = d;
      if (token !== routeToken) return;
      $('homeStatus').classList.add('hidden');
      renderHome(d);
    }

    // ── condo page ────────────────────────────────────────────
    const RENT_STATE = {
      vacant:  { text:'ยังไม่ได้ปล่อยเช่า', cls:'muted' },
      paid:    { text:'✅ ชำระแล้ว',        cls:'pos' },
      partial: { text:'🟡 ชำระบางส่วน',     cls:'warn' },
      unpaid:  { text:'🔴 ยังไม่ชำระ',      cls:'neg' },
    };

    function renderProp(d) {
      propData = d;
      $('propName').textContent = d.name;
      $('propOwner').textContent = 'เจ้าของ: ' + d.owner;

      renderInfo(d.info || {});

      const netCls = d.allTime.net > 0 ? 'pos' : d.allTime.net < 0 ? 'neg' : '';
      $('allTimeNet').textContent = bahtSigned(d.allTime.net);
      $('allTimeNet').className = 'v ' + netCls;
      $('allTimeSub').textContent = 'รับ ' + baht(d.allTime.income) + ' · จ่าย ' + baht(d.allTime.expense);

      const rs = RENT_STATE[d.rent.state];
      $('rentState').textContent = rs.text;
      $('rentState').className = 'v ' + rs.cls;
      $('rentSub').textContent =
        d.rent.state === 'vacant'  ? 'ไม่มีสัญญาเช่าในเดือนนี้' :
        d.rent.state === 'paid'    ? baht(d.rent.paid) + ' · ผู้เช่า: ' + d.rent.tenant :
        d.rent.state === 'partial' ? 'รับแล้ว ' + baht(d.rent.paid) + '/' + baht(d.rent.due) + ' · ' + d.rent.tenant :
                                     baht(d.rent.due) + ' · ครบกำหนด ' + thDate(d.rent.dueDate);

      // default selection: latest month that has data, else the latest month
      selectedBar = d.monthly.length - 1;
      for (let i = d.monthly.length - 1; i >= 0; i--) {
        if (d.monthly[i].income || d.monthly[i].expense) { selectedBar = i; break; }
      }
      renderChart();
      renderMonthOptions(d);
      renderTxnList(d, $('monthSel').value);
    }

    // ── unit metadata card (from 2_properties.csv fields) ─────
    function renderInfo(info) {
      const items = [];
      if (info.floor) items.push(['ชั้น', esc(info.floor)]);
      if (info.unitNo) items.push(['เลขห้อง', esc(info.unitNo)]);
      if (info.sizeSqm != null) items.push(['ขนาด', Number(info.sizeSqm).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ตร.ม.']);
      if (info.purchasePrice != null) items.push(['ราคาซื้อ', baht(info.purchasePrice)]);
      if (info.rentalAim != null) items.push(['ค่าเช่าเป้าหมาย', baht(info.rentalAim) + '<span class="muted" style="font-weight:400">/เดือน</span>']);
      if (info.rentalAim != null && info.purchasePrice > 0) {
        items.push(['Yield เป้าหมาย', (info.rentalAim * 12 / info.purchasePrice * 100).toFixed(2) + '%<span class="muted" style="font-weight:400">/ปี</span>']);
      }
      $('infoCard').classList.toggle('hidden', items.length === 0);
      $('infoGrid').innerHTML = items.map(([k, v]) =>
        '<div><div class="k">' + k + '</div><div class="v">' + v + '</div></div>').join('');
    }

    async function showProp(id) {
      const token = ++routeToken;
      $('homeView').classList.add('hidden');
      $('propView').classList.remove('hidden');
      const cached = cache.props.get(id);
      if (cached) { $('propBody').classList.remove('hidden'); renderProp(cached); }
      else {
        $('propBody').classList.add('hidden');
        $('propName').textContent = '…';
        $('propOwner').textContent = '';
        $('propStatus').classList.remove('hidden');
      }
      const d = await api('/api/property/' + encodeURIComponent(id));
      cache.props.set(id, d);
      if (token !== routeToken) return;
      $('propStatus').classList.add('hidden');
      $('propBody').classList.remove('hidden');
      renderProp(d);
    }

    // ── monthly net bar chart (SVG, tap a bar for details) ────
    function renderChart() {
      const monthly = propData.monthly;
      const hasData = monthly.some((m) => m.income || m.expense);
      if (!hasData) {
        $('chartBox').innerHTML = '<div class="empty">ยังไม่มีรายการในช่วง 12 เดือนนี้</div>';
        $('chartCaption').textContent = '';
        return;
      }

      const W = 520, H = 210, padL = 6, padR = 6, padT = 20, padB = 20;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const nets = monthly.map((m) => m.net);
      const maxPos = Math.max(0, ...nets), maxNeg = Math.min(0, ...nets);
      const range = (maxPos - maxNeg) || 1;
      const y = (v) => padT + ((maxPos - v) / range) * plotH;
      const zeroY = y(0);
      const slot = plotW / monthly.length;
      const barW = Math.min(30, slot - 6);
      const maxI = nets.indexOf(Math.max(...nets));
      const minI = nets.indexOf(Math.min(...nets));

      const compact = (v) => {
        const a = Math.abs(v);
        const s = a >= 1e6 ? (a / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'
                : a >= 1e3 ? (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k'
                : String(Math.round(a));
        return (v < 0 ? '−' : '') + s;
      };

      // bar with a 4px-rounded data end, anchored square to the zero baseline
      const barPath = (x, w, y1) => {
        const up = y1 < zeroY;
        const h = Math.abs(zeroY - y1);
        if (h < 0.75) return '';
        const r = Math.min(4, w / 2, h);
        const yr = up ? y1 + r : y1 - r;
        return 'M' + x + ',' + zeroY + ' L' + x + ',' + yr +
          ' Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 +
          ' L' + (x + w - r) + ',' + y1 +
          ' Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + yr +
          ' L' + (x + w) + ',' + zeroY + ' Z';
      };

      const parts = [];
      monthly.forEach((m, i) => {
        const x0 = padL + i * slot;
        const bx = x0 + (slot - barW) / 2;
        if (i === selectedBar) {
          parts.push('<rect x="' + x0 + '" y="' + padT + '" width="' + slot + '" height="' + plotH + '" rx="6" fill="rgba(27,31,36,.05)"/>');
        }
        const p = barPath(bx, barW, y(m.net));
        if (p) {
          parts.push('<path d="' + p + '" fill="' + (m.net >= 0 ? 'var(--pos)' : 'var(--neg)') + '"' +
            (i === selectedBar ? ' stroke="var(--ink)" stroke-width="1.5"' : '') + '/>');
        } else if (m.income || m.expense) {
          // net exactly zero but the month had activity — mark it with a tick
          parts.push('<rect x="' + bx + '" y="' + (zeroY - 1) + '" width="' + barW + '" height="2" rx="1" fill="var(--muted)"/>');
        }
        // selective value labels: only the best and worst month
        if ((i === maxI || i === minI) && Math.abs(zeroY - y(m.net)) >= 0.75 && maxI !== minI) {
          const up = m.net >= 0;
          let ly = up ? y(m.net) - 5 : y(m.net) + 12;
          // a full-height negative bar leaves no room below — label above the baseline instead
          if (!up && ly >= H - padB - 2) ly = zeroY - 5;
          parts.push('<text x="' + (x0 + slot / 2) + '" y="' + ly + '" text-anchor="middle" font-size="10" font-weight="600" fill="var(--muted)">' + compact(m.net) + '</text>');
        }
        parts.push('<text x="' + (x0 + slot / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" ' +
          (i === selectedBar ? 'font-weight="700" fill="var(--ink)"' : 'fill="var(--muted)"') + '>' +
          TH_MONTHS[Number(m.month.slice(5, 7)) - 1] + '</text>');
        parts.push('<rect class="hit" data-i="' + i + '" x="' + x0 + '" y="' + padT + '" width="' + slot + '" height="' + (plotH + padB) + '" fill="transparent"/>');
      });
      // zero baseline above the fills but below the hit layer (parts order keeps hits last per slot — draw it first instead)
      parts.unshift('<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (W - padR) + '" y2="' + zeroY + '" stroke="#d0d5dd" stroke-width="1"/>');

      $('chartBox').innerHTML =
        '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="กราฟรายรับสุทธิรายเดือน">' + parts.join('') + '</svg>';
      $('chartBox').querySelectorAll('.hit').forEach((r) => {
        r.addEventListener('click', () => { selectedBar = Number(r.dataset.i); renderChart(); });
      });

      const sel = monthly[selectedBar];
      $('chartCaption').innerHTML = '<b>' + thMonthYear(sel.month) + '</b> · สุทธิ <b>' + bahtSigned(sel.net) + '</b>' +
        ' (รับ ' + baht(sel.income) + ' · จ่าย ' + baht(sel.expense) + ')';
    }

    // ── transaction list + month filter ───────────────────────
    function renderMonthOptions(d) {
      const months = [...new Set(d.txns.map((t) => t.month))]; // txns are newest-first
      $('monthSel').innerHTML =
        '<option value="recent">ล่าสุด</option>' +
        months.map((m) => '<option value="' + m + '"' + (m === d.currentPeriod ? '' : '') + '>' + thMonthYear(m) + '</option>').join('');
      $('monthSel').value = 'recent';
    }

    function renderTxnList(d, filter) {
      const list = filter === 'recent' ? d.txns.slice(0, 30) : d.txns.filter((t) => t.month === filter);
      $('txnList').innerHTML = list.map((t) =>
        '<div class="txn">' +
          '<div><div>' + esc(catTh(t.category)) + (t.note ? ' — ' + esc(t.note) : '') + '</div>' +
          '<div class="meta">' + thDate(t.date) + '</div></div>' +
          '<div class="amt ' + t.direction + '">' + (t.direction === 'in' ? '+' : '−') + baht(t.amount) + '</div>' +
        '</div>'
      ).join('') || '<div class="empty">ไม่มีรายการ' + (filter === 'recent' ? '' : 'ในเดือนนี้') + '</div>';
    }

    $('monthSel').addEventListener('change', () => { if (propData) renderTxnList(propData, $('monthSel').value); });
    $('backBtn').addEventListener('click', () => { location.hash = '#/'; });

    // ── routing + boot ─────────────────────────────────────────
    function route() {
      const m = location.hash.match(/^#\/p\/([0-9a-f-]{36})$/i);
      (m ? showProp(m[1]) : showHome()).catch(showErr);
    }
    window.addEventListener('hashchange', route);

    async function boot() {
      try {
        const cfg = await fetch('/api/config').then((r) => r.json());
        if (!cfg.liffId) throw new Error('เซิร์ฟเวอร์ไม่พบ LIFF_ID');
        await liff.init({ liffId: cfg.liffId });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        idToken = liff.getIDToken();
        if (!idToken) throw new Error('ไม่พบ ID token — ตรวจสอบว่า LIFF scope มี “openid” หรือไม่');
        route(); // #app stays hidden until api() confirms access
      } catch (e) {
        $('boot').textContent = 'ตั้งค่าผิดพลาด: ' + (e && e.message ? e.message : e);
      }
    }

    function showErr(e) {
      $('homeStatus').classList.add('hidden');
      $('propStatus').classList.add('hidden');
      if (e && e.denied) {
        // No access: blank page with just the server's Thai explanation.
        $('app').classList.add('hidden');
        $('boot').textContent = e.message;
        $('boot').classList.remove('hidden');
        return;
      }
      alert(e && e.message ? e.message : e);
    }

    boot();
  </script>
</body>
</html>
