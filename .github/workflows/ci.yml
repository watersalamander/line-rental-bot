name: CI

# Typecheck + build on every push and PR. Deploying is a separate workflow
# (deploy.yml → AWS Lambda), which runs its own typecheck before shipping.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build Lambda bundle
        run: npm run build:lambda
